name: Publish Package to npmjs

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Sem registry-url: evita que setup-node grave _authToken=${NODE_AUTH_TOKEN}
      # e exporte NODE_AUTH_TOKEN dummy (isso bloqueia o OIDC / Trusted Publishing).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ensure npm 11.5.1+ (OIDC support)
        run: |
          npm install -g npm@latest
          node -v
          npm -v

      - name: Prepare registry (no token — OIDC only)
        run: |
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN
          # limpa qualquer npmrc residual com token
          rm -f .npmrc "$HOME/.npmrc" "${NPM_CONFIG_USERCONFIG:-}" || true
          npm config delete //registry.npmjs.org/:_authToken || true
          npm config set registry https://registry.npmjs.org/
          echo "npmrc files:"
          ls -la .npmrc "$HOME/.npmrc" 2>/dev/null || true
          echo "NODE_AUTH_TOKEN=${NODE_AUTH_TOKEN-<unset>}"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set? $([ -n \"$ACTIONS_ID_TOKEN_REQUEST_URL\" ] && echo yes || echo no)"

      - name: Publish to npmjs (Trusted Publishing / OIDC)
        env:
          # forçar ausência de token clássico
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          npm publish --access public
