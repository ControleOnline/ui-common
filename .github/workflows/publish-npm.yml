name: Publish Package to npmjs

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm test --if-present

      - run: npm run build --if-present

      - run: npm publish --access public
        # Trusted Publishing (OIDC) — sem NODE_AUTH_TOKEN / secret de longa duração
        # Provenance é gerado automaticamente quando id-token: write está presente
