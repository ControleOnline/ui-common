name: Publish Package to npmjs

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # setup-node grava _authToken=${NODE_AUTH_TOKEN} no .npmrc; sem secret
      # isso impede o OIDC. Remover para o Trusted Publishing funcionar.
      - name: Enable OIDC (strip dummy authToken)
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc" || true
          fi
          rm -f .npmrc || true

      - name: Publish to npmjs
        run: npm publish --access public
